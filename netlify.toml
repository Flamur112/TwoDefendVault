[build]
  command = "npm run build"
  publish = ".output/public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "/favicon-16.png"
  to = "/favicon-16.png"
  status = 200

[[redirects]]
  from = "/favicon-32.png"
  to = "/favicon-32.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/site.webmanifest"
  to = "/site.webmanifest"
  status = 200

[[redirects]]
  from = "/logo.svg"
  to = "/logo.svg"
  status = 200

[[redirects]]
  from = "/vault"
  to = "/clients"
  status = 301

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "ORG_SLUG,APP_URL,ZOHO_AUTH_URL,ZOHO_TOKEN_URL,ZOHO_USER_INFO_URL,ZOHO_REDIRECT_URI"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,VAULT_AGENT.md,scripts/*,supabase/*"
